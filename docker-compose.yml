services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: routine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routine_local}
      POSTGRES_DB: analog_routine_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routine -d analog_routine_tracker"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://routine:${POSTGRES_PASSWORD:-routine_local}@db:5432/analog_routine_tracker
      NODE_ENV: production
      PORT: "3001"
      STORAGE_MODE: local
      LOCAL_STORAGE_PATH: /data/uploads
      API_URL: http://localhost:3001
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_AUTH_TOKEN: ${API_AUTH_TOKEN:-change-me-in-production}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  caddy:
    build:
      context: ./caddy-config
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
